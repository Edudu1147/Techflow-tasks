<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechFlow Tasks</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #172b4d; }
    header { background: #0b5fff; color: #fff; padding: 1rem 1.5rem; }
    main { padding: 1rem 1.5rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input, select, button { padding: .5rem; font: inherit; }
    .quadro { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
    .coluna { background: #ebecf0; border-radius: 6px; padding: .75rem; }
    .cartao { background: #fff; border-radius: 4px; padding: .6rem; margin-top: .5rem;
              box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .cartao small { color: #5e6c84; display: block; }
    .prio-Crítica { color: #bf2600; font-weight: bold; }
    .metricas { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .metricas div { background: #fff; padding: .5rem 1rem; border-radius: 6px;
                    box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .acoes { display: flex; gap: .3rem; margin-top: .4rem; }
  </style>
</head>
<body>
  <header><h1>TechFlow Tasks</h1></header>
  <main>
    <form id="form">
      <input id="titulo" placeholder="Título da tarefa" required maxlength="100">
      <input id="descricao" placeholder="Descrição">
      <select id="prioridade">
        <option>Baixa</option><option selected>Média</option><option>Alta</option><option>Crítica</option>
      </select>
      <button>Adicionar</button>
    </form>
    <div class="metricas" id="metricas"></div>
    <div class="quadro" id="quadro"></div>
  </main>
  <script>
    const STATUS = ["A Fazer", "Em Progresso", "Concluído"];
    const api = (url, opts) => fetch(url, opts).then(r => r.status === 204 ? null : r.json());
    const json = (metodo, corpo) => ({ method: metodo,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });

    async function carregarMetricas() {
      const m = await api("/api/metricas");
      document.getElementById("metricas").innerHTML =
        `<div>Total: <b>${m.total}</b></div>` +
        `<div>Críticas em aberto: <b>${m.criticas_abertas}</b></div>` +
        `<div>Taxa de conclusão: <b>${m.taxa_conclusao}%</b></div>`;
    }

    async function carregar() {
      carregarMetricas();
      const tarefas = await api("/api/tarefas");
      const quadro = document.getElementById("quadro");
      quadro.innerHTML = "";
      for (const st of STATUS) {
        const col = document.createElement("div");
        col.className = "coluna";
        col.innerHTML = `<strong>${st}</strong>`;
        for (const t of tarefas.filter(x => x.status === st)) {
          const c = document.createElement("div");
          c.className = "cartao";
          const titulo = document.createElement("strong");
          titulo.textContent = t.titulo;
          const prio = document.createElement("small");
          prio.className = "prio-" + t.prioridade;
          prio.textContent = "Prioridade: " + t.prioridade;
          const desc = document.createElement("small");
          desc.textContent = t.descricao;
          const acoes = document.createElement("div");
          acoes.className = "acoes";
          for (const dest of STATUS.filter(s => s !== st)) {
            const b = document.createElement("button");
            b.textContent = "→ " + dest;
            b.onclick = async () => { await api("/api/tarefas/" + t.id, json("PUT", { status: dest })); carregar(); };
            acoes.append(b);
          }
          const del = document.createElement("button");
          del.textContent = "Excluir";
          del.onclick = async () => { await api("/api/tarefas/" + t.id, { method: "DELETE" }); carregar(); };
          acoes.append(del);
          c.append(titulo, prio, desc, acoes);
          col.append(c);
        }
        quadro.append(col);
      }
    }

    document.getElementById("form").onsubmit = async e => {
      e.preventDefault();
      await api("/api/tarefas", json("POST", {
        titulo: document.getElementById("titulo").value,
        descricao: document.getElementById("descricao").value,
        prioridade: document.getElementById("prioridade").value }));
      e.target.reset();
      carregar();
    };
    carregar();
  </script>
</body>
</html>
